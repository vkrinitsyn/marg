[package]
name = "marg"
version = "0.4.5"
edition = "2024"
authors = ["Vladimir Krinitsyn <v.krinitsyn@gmail.com>", "support@dbinvent.com"]
license = "MIT"
description = "Meta config for apps from args"
homepage = "https://vkrinitsyn.github.io/"
repository = "https://github.com/vkrinitsyn/marg.git"
documentation = "https://github.com/vkrinitsyn/marg.git"
keywords = ["arg"]

[dependencies]
uuid = { version = "^1", features = ["v4"] }
base64 = "^0.23"
rand = { version = "^0.10" , optional = true}

[features]
# at least one db feature is better to set
default = ["postgres"]
# default
postgres = []
#
sqlite = []

# pull temorary password, like session token from a script run
token = []

# check for key text file, to use for RSA of AES
key = []

# keep SECRET in the environment after reading it; without this feature it is taken
# out (std::env::remove_var - an unsafe call since edition 2024)
keep_env_secret = []

# support secret generation to have rand optional
gen_secret = ["rand"]
