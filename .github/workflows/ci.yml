name: ci

# The tests with each feature set, and the line coverage of them all: under 69% fails
# the run (measured 69.3%; diff-doc-rs holds 90). The coverage badge is our own, no
# third party: drawn from lcov.info and kept on the `badges` branch (the coverage job's
# last step). No database service: marg only parses the URL, never connects.
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a branch's newer push cancels its older run; on main each run stands (the badge):
  # a cancelled run there shows as failing
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # default: postgres; no db; sqlite alone; every optional one but token. With
        # token the tests' token names run as commands ("mytoken": no such file)
        features:
          - ""
          - "--no-default-features"
          - "--no-default-features --features sqlite"
          - "--features sqlite,key,keep_env_secret,gen_secret"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test ${{ matrix.features }}

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the coverage badge's push, to the badges branch
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # token has no test run (above): it still has to build
      - run: cargo check --all-features --all-targets
      - run: cargo llvm-cov --features sqlite,key,keep_env_secret,gen_secret --lcov --output-path lcov.info --fail-under-lines 69
      # [coverage] our own badge, no third party: lcov.info's line coverage, drawn by
      # .github/coverage-badge.py and kept on the `badges` branch - one commit, replaced
      # each time - which the README shows. On a push to the default branch only: a pull
      # request measures and gates, no more
      - name: coverage badge
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(python3 .github/coverage-badge.py lcov.info /tmp/badges/coverage.svg)
          cd /tmp/badges
          git init -q -b badges
          git add coverage.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "coverage ${pct}%"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
